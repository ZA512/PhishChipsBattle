server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html phishing.html;

    # Security headers
    include /usr/share/nginx/html/security-headers.conf;

    # Gzip compression
    gzip on;
    gzip_types text/css application/javascript text/html image/svg+xml;

    # Proxy all /api/* to the backend
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # Cache-Control for HTML files — no cache to avoid stale versions after deploy
    location ~* \.(html|css|js)$ {
        include /usr/share/nginx/html/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Serve static files with caching
    location ~* \.(png|jpg|svg|woff2?)$ {
        include /usr/share/nginx/html/security-headers.conf;
        expires 1d;
        add_header Cache-Control "public, no-transform";
    }

    # Fallback for SPA-style pages
    location / {
        try_files $uri $uri/ =404;
    }
    location = /security-headers.conf { deny all; }
    location = /nginx.conf { deny all; }
}
