<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Mon dossier — Phish & Chips</title>
    <link rel="stylesheet" href="enterprise.css" />
    <link rel="stylesheet" href="portal.css" />
    <script src="appearance.js"></script>
  </head>
  <body class="enterprise">
    <main class="profile-container" id="profile-root">
      <a href="scores.html" class="back-link">← Classements d’entraînement</a>
      <p id="loading" class="notice">Ouverture du dossier…</p>
      <p id="error" class="notice error" hidden role="alert"></p>
      <div id="content" hidden>
        <span class="eyebrow">Dossier du personnel · pièces à conviction</span>
        <div class="profile-header">
          <div class="profile-avatar" id="avatar"></div>
          <div>
            <h1 id="player-name"></h1>
            <p id="player-since"></p>
          </div>
        </div>
        <div class="profile-stats" id="stats-grid"></div>
        <section id="recent-section">
          <h2>Les dernières preuves</h2>
          <div class="recent-badges" id="recent-badges"></div>
        </section>
        <section class="achievements-section">
          <h2>
            Collection de badges
            <span class="pill"
              ><span id="unlocked-count">0</span> /
              <span id="total-count">0</span></span
            >
          </h2>
          <p class="meta">
            Les preuves s’accumulent. Ouvrez une famille pour voir ses paliers
            et ses difficultés.
          </p>
          <div class="progress-bar">
            <div class="fill" id="progress-fill"></div>
          </div>
          <div class="badge-controls">
            <label for="badge-state">Afficher</label
            ><select id="badge-state">
              <option value="all">Tous les badges</option>
              <option value="unlocked">Obtenus</option>
              <option value="locked">À débloquer</option>
            </select>
          </div>
          <div
            class="filter-bar"
            id="filter-bar"
            role="group"
            aria-label="Catégorie des badges"
          ></div>
          <p class="meta" id="badge-summary" role="status"></p>
          <div class="achievements-grid" id="achievements-grid"></div>
        </section>
      </div>
    </main>
    <script src="account.js"></script>
    <script src="profile.js"></script>
  </body>
</html>
