<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Mon équipe — Phish & Chips</title>
    <link rel="stylesheet" href="enterprise.css" />
  </head>
  <body class="enterprise">
    <main>
      <h1>Votre équipe, votre choix.</h1>
      <p class="lead">
        L’organigramme aide à vous proposer une équipe. Vous pouvez choisir
        celle qui vous correspond, puis la changer ici. Les battles déjà créées
        conservent leurs équipes d’origine.
      </p>
      <section class="card">
        <p id="message" class="notice" role="status">Chargement…</p>
        <form id="team-form">
          <label for="team-select">Mon équipe</label
          ><select id="team-select" required>
            <option value="">Choisissez une équipe</option></select
          ><button class="btn" id="save" type="submit" disabled>
            Confirmer mon équipe
          </button>
        </form>
        <p id="recommendation" class="meta"></p>
      </section>
      <section class="card">
        <h2>Historique</h2>
        <div id="history"></div>
      </section>
    </main>
    <script src="account.js"></script>
    <script src="teams.js"></script>
  </body>
</html>
