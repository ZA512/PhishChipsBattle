services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pcb_test
      POSTGRES_PASSWORD: pcb_test_only
      POSTGRES_DB: phishchips_test
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pcb_test -d phishchips_test"]
      interval: 2s
      timeout: 3s
      retries: 15
    tmpfs:
      - /var/lib/postgresql/data
