name: API enterprise checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pcb_test
          POSTGRES_PASSWORD: pcb_test_only
          POSTGRES_DB: phishchips_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pcb_test -d phishchips_test"
          --health-interval 2s --health-timeout 3s --health-retries 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://pcb_test:pcb_test_only@127.0.0.1:5432/phishchips_test
      - run: npm audit --omit=dev
